name: poker_ledger
description: Professional poker session & cash management app for table hosts.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local storage (offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # IDs & formatting
  uuid: ^4.4.0
  intl: ^0.20.2

  # Signature capture
  signature: ^5.5.0

  # Export
  pdf: ^3.11.1
  csv: ^6.0.0
  share_plus: ^10.0.0

  # Security
  crypto: ^3.0.3

  # Backup & Restore
  file_picker: ^11.0.0

  # Casino chip sound effects
  audioplayers: ^6.1.0

  # App Lock — device fingerprint / face / passcode.
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46
  local_auth_darwin: ^1.4.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Generates real Android/iOS launcher icons from assets/images/app_icon.png.
# This project has no android/ios platform folders yet (never had
# `flutter create .` run against it) — after running that once, generate
# the actual icon files with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0B1210"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # The single real poker chip recording used for every chip action.
    - assets/sounds/
    - assets/fonts/

  # Optional: drop a Farsi-friendly font (e.g. Vazirmatn, from
  # https://github.com/rastikerdar/vazirmatn) into assets/fonts/ and
  # uncomment below for nicer Persian typography.
  # fonts:
  #   - family: Vazirmatn
  #     fonts:
  #       - asset: assets/fonts/Vazirmatn-Regular.ttf
  #       - asset: assets/fonts/Vazirmatn-Bold.ttf
  #         weight: 700
